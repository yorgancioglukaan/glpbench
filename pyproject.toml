[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glpbench"
dynamic = ["version"]
description = "Evaluation pipelines for transductive and semi-inductive graph link prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Kaan Yorgancioglu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "torch>=2.1,<3",
    "torch-geometric>=2.5,<3",
    "tqdm>=4.60",
]

[project.urls]
Repository = "https://github.com/yorgancioglukaan/glpbench"
Issues = "https://github.com/yorgancioglukaan/glpbench/issues"

[project.scripts]
glpbench = "glpbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "glpbench.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

