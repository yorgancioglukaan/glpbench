# Feature-only MLP benchmark under the fixed-budget held-out protocol.
# Hyperparameters are transferred from the selected GAE-MLP configuration for
# each dataset, making this a controlled feature-vs-graph representation test.
version: 2
kind: selected-hyperparameter-benchmark

output: out/feature_mlp_benchmark.csv
error_output: out/feature_mlp_benchmark.errors.jsonl
data_root: data

seeds: [200, 201, 202]

selected_configurations:
  path: configs/feature_mlp_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

defaults:
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8
  epochs: 500
  selection_metric: roc_auc
  checkpoint_strategy: best-validation
  training_policy: fixed-500-validation-best
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
  early_stopping_minimum_epochs: 0
  lr_scheduler: none
  lr_scheduler_kwargs: null
  device: cpu

datasets:
  - cora
  - citeseer
  - pubmed
  - amazon-photo
  - amazon-computers
  - coauthor-cs
  - dblp
  - wikics

models:
  - feature-mlp
