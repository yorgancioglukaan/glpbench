# Small validation-only convergence audit using illustrative selected settings.
version: 1
kind: validation-convergence-audit

artifacts:
  results: out/example_audit.csv
  epoch_history: out/example_audit_epochs.csv
  failures: out/example_audit.errors.jsonl

execution:
  device: cpu
  data_root: data
  fail_fast: false

seeds: [0]

selected_configurations:
  path: configs/example_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

datasets: [cora]
models: [symmetric, asymmetric]

splits:
  protocol: matched-semi-inductive-validation-only
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8

training:
  max_epochs: 100
  selection_metric: roc_auc
  checkpoint: best-validation
  early_stopping:
    enabled: false
  scheduler:
    type: none
