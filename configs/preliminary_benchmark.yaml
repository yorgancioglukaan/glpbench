# Preliminary held-out evaluation using hyperparameters selected by the pilot.
version: 2
kind: selected-hyperparameter-benchmark

output: out/preliminary_benchmark.csv
error_output: out/preliminary_benchmark.errors.jsonl
data_root: data

# Keep evaluation seeds separate from tuning seeds 100, 101, and 102.
seeds: [200, 201, 202]

selected_configurations:
  path: out/pilot_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

defaults:
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8
  epochs: 100
  selection_metric: roc_auc
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
  device: cpu

datasets:
  - cora
  - citeseer
  - pubmed
  - amazon-photo
  - amazon-computers
  - coauthor-cs
  - dblp
  - wikics

models:
  - symmetric
  - asymmetric
  - asymmetric-mlp
  - mlp
  - variational
  - deal
