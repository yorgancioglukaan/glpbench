# AGAE learning-rate scheduler ablation on long-training datasets.
version: 1
kind: training-policy-ablation

output: out/agae_scheduler_ablation.csv
error_output: out/agae_scheduler_ablation.errors.jsonl
epoch_history_output: out/agae_scheduler_ablation_epochs.csv
data_root: data

# Match the completed long-budget studies for paired comparisons.
seeds: [300, 301, 302, 303, 304, 305, 306, 307, 308, 309]

selected_configurations:
  path: out/pilot_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

datasets:
  - wikics
  - amazon-photo

models:
  - asymmetric

splits:
  protocol: matched-semi-inductive
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8
  paired_across_policies: true

evaluation:
  split_types: [transductive, inductive]
  primary_split: inductive
  primary_metric: roc_auc
  secondary_metrics: [average_precision]

training:
  device: cpu
  selection_metric: roc_auc
  log_epoch_history: true
  epoch_history_metrics: [training_loss, validation_roc_auc]

training_policies:
  - name: constant-500
    max_epochs: 500
    checkpoint: best-validation
    early_stopping:
      enabled: false
    scheduler:
      type: none

  - name: plateau-500
    max_epochs: 500
    checkpoint: best-validation
    early_stopping:
      enabled: false
    scheduler:
      type: reduce-on-plateau
      factor: 0.5
      patience: 25
      threshold: 0.001
      minimum_learning_rate: 0.00001

  - name: cosine-500
    max_epochs: 500
    checkpoint: best-validation
    early_stopping:
      enabled: false
    scheduler:
      type: cosine-annealing
      minimum_learning_rate: 0.00001
