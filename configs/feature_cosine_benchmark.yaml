# Feature-only cosine baseline evaluated on the exact split seeds and split
# settings used by the fixed-budget benchmark.
version: 1

output: out/feature_cosine_benchmark.csv
error_output: out/feature_cosine_benchmark.errors.jsonl
data_root: data

seeds: [200, 201, 202]

defaults:
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8
  epochs: 500
  selection_metric: roc_auc
  checkpoint_strategy: best-validation
  training_policy: fixed-500-validation-best
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
  early_stopping_minimum_epochs: 0
  lr_scheduler: none
  lr_scheduler_kwargs: null
  normalize_features: true
  device: cpu

datasets:
  - cora
  - citeseer
  - pubmed
  - amazon-photo
  - amazon-computers
  - coauthor-cs
  - dblp
  - wikics

models:
  - type: feature-cosine
