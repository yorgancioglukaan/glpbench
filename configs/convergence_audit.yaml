# Validation-only audit of whether each selected model has converged by epoch 500.
version: 1
kind: validation-convergence-audit

artifacts:
  results: out/convergence_audit.csv
  epoch_history: out/convergence_audit_epochs.csv
  failures: out/convergence_audit.errors.jsonl

execution:
  device: cpu
  data_root: data
  fail_fast: false

# Separate from tuning seeds (100--102) and preliminary benchmark seeds
# (200--202).
seeds: [400, 401, 402]

selected_configurations:
  path: configs/pilot_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

datasets:
  - cora
  - citeseer
  - pubmed
  - amazon-photo
  - amazon-computers
  - coauthor-cs
  - dblp
  - wikics

models:
  - symmetric
  - asymmetric
  - asymmetric-mlp
  - mlp
  - variational
  - deal

splits:
  protocol: matched-semi-inductive-validation-only
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8

training:
  max_epochs: 500
  selection_metric: roc_auc
  checkpoint: best-validation
  early_stopping:
    enabled: false
  scheduler:
    type: none
