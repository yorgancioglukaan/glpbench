# Held-out evaluation under the training protocol selected by the convergence
# audit. Evaluation seeds and splits match the preliminary benchmark so that
# changes can be attributed to the longer training protocol.
version: 2
kind: selected-hyperparameter-benchmark

output: out/fixed_budget_benchmark.csv
error_output: out/fixed_budget_benchmark.errors.jsonl
data_root: data

# These are held-out evaluation seeds, distinct from tuning seeds 100--102 and
# convergence-audit seeds 400--402.
seeds: [200, 201, 202]

selected_configurations:
  path: out/pilot_selected_configurations.yaml
  granularity: [dataset, architecture]
  require_all_pairs: true

defaults:
  query_fraction: 0.05
  validation_query_fraction: 0.05
  train_ratio: 0.8
  epochs: 500
  selection_metric: roc_auc
  checkpoint_strategy: best-validation
  training_policy: fixed-500-validation-best
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
  early_stopping_minimum_epochs: 0
  lr_scheduler: none
  lr_scheduler_kwargs: null
  device: cpu

datasets:
  - cora
  - citeseer
  - pubmed
  - amazon-photo
  - amazon-computers
  - coauthor-cs
  - dblp
  - wikics

models:
  - symmetric
  - asymmetric
  - asymmetric-mlp
  - mlp
  - variational
  - deal
